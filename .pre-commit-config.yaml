repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=10240"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the `ruff==` pin in pyproject.toml [dev].
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Keep in sync with the `mypy==` pin in pyproject.toml [dev].
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^src/qimp/
        additional_dependencies:
          - numpy
          - pytest
          - qiskit>=1.0
          - qiskit-aer>=0.14
          - scipy>=1.11
          - scipy-stubs
          - pillow>=10.0
          - imageio>=2.31
