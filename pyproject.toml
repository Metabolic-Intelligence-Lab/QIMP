[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "qimp-mi"
dynamic = ["version"]
description = "Quantum Image Processing library — FRQI / NEQR / QPIE encodings with processing, testing, and metrics on Qiskit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Metabolic Intelligence Lab", email = "byome@chirale.it" },
]
keywords = [
    "quantum-computing",
    "image-processing",
    "qiskit",
    "frqi",
    "neqr",
    "qpie",
    "qhed",
    "qimp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "numpy>=1.24",
    "scipy>=1.11",
    "pillow>=10.0",
    "imageio>=2.31",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
ibm = [
    "qiskit-ibm-runtime>=0.20",
]
gpu = [
    "qiskit-aer-gpu>=0.14",
]
qml = [
    "qiskit-machine-learning>=0.7",
    "scikit-learn>=1.3",
]
notebooks = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.1",
]
ui = [
    "streamlit>=1.30",
    "pandas>=2.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "scipy-stubs",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/Metabolic-Intelligence-Lab/QIMP"
Repository = "https://github.com/Metabolic-Intelligence-Lab/QIMP"
Issues = "https://github.com/Metabolic-Intelligence-Lab/QIMP/issues"
Documentation = "https://Metabolic-Intelligence-Lab.github.io/QIMP/"
Changelog = "https://github.com/Metabolic-Intelligence-Lab/QIMP/blob/main/CHANGELOG.md"

[project.scripts]
qimp = "qimp.cli:main"

[tool.hatch.version]
path = "src/qimp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qimp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qimp",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "data",
    "legacy",
    "notebooks",
    "docs/_site",
    # 15 MB PDF — far too big to ship in source distributions. Link from
    # the GitHub release page instead.
    "docs/tesi.pdf",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "apps"]
extend-exclude = ["legacy", "data", "notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (formatter handles it)
    "N803",   # argument lowercase (we keep n, m, q for qubit counts)
    "N806",   # variable lowercase (same reason)
    "RUF001", # ambiguous unicode in strings (× – θ are physics notation)
    "RUF002", # same, in docstrings
    "RUF003", # same, in comments
]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages need to bootstrap sys.path before importing app-local
# modules (see the `_QIMP_APP_ROOT` block at the top of each file).
"apps/qimp_explorer/app.py" = ["E402", "I001"]
"apps/qimp_explorer/pages/*.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/qimp"]
# `apps/qimp_explorer/pages/*.py` use numeric prefixes (Streamlit's
# multi-page convention) which mypy can't import. The helpers in `_io.py`
# and `_viz.py` are covered by their unit tests; the pages are smoke-tested
# in `tests/unit/test_app_imports.py`.
exclude = ["legacy", "data", "tests/fixtures", "apps"]

[[tool.mypy.overrides]]
# Only mask libs that genuinely lack inline type info / stubs. scipy, pandas,
# matplotlib ship usable stubs (scipy ≥ 1.13 has inline annotations; pandas
# has its own stubs); silencing them masks real type errors. Streamlit is
# only imported under `apps/` (excluded from mypy anyway).
module = [
    "qiskit.*",
    "qiskit_aer.*",
    "qiskit_ibm_runtime.*",
    "imageio.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Slow tests are deselected by default; opt in explicitly with `-m slow`
    # or `-m "slow or not slow"` to run everything. CI runs both.
    "-m", "not slow",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (run with '-m slow' or '-m \"slow or not slow\"')",
    "hardware: marks tests that require IBM Quantum hardware credentials",
    "gpu: marks tests that require a CUDA-capable GPU",
]

[tool.coverage.run]
source = ["src/qimp"]
omit = ["src/qimp/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
